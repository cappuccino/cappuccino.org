{{ define "main" }}
    <section>
        <header>
            <h1>{{ .Title }}</h1>
            {{ .Content }}
        </header>
        <ul>
            {{- range .Pages }}
                <li>
                    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
                    {{- with .Date }}
                        <time datetime="{{ .Format "2006-01-02" }}">{{ .Format "2006-01-02" }}</time>
                    {{- end }}
                </li>
            {{- end }}
        </ul>
    </section>
{{ end }}
